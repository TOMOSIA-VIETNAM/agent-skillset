schema_version: "1.1"
name: existing-file-creates-v2
context:
  scaffold_script: place-files.sh
expected_outcome: |
  A bio file with today's name already exists. The skill prints the bio, then asks with a form whether to
  create short-bio-nguyen-van-f-<date>-v2.md (recommended) or overwrite. The old file stays untouched
  when v2 is chosen and the skill prints "Đã lưu: ...-v2.md".

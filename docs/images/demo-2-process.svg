<text x="28" y="67" xml:space="preserve"><tspan class="label">Thông tin đọc từ CV:</tspan></text>
<text x="28" y="88" xml:space="preserve"><tspan class="ink">- Tên: Nguyễn Văn D · Email: d.nguyen@example.com · Role: Backend</tspan></text>
<text x="28" y="109" xml:space="preserve"><tspan class="ink">- Số năm kinh nghiệm: 4 năm (theo CV ghi)</tspan></text>
<text x="28" y="130" xml:space="preserve"><tspan class="ink">- Tech stack: PHP, Laravel (4 năm), MySQL, Redis, Docker, Git, RESTful API, …</tspan></text>
<text x="28" y="151" xml:space="preserve"><tspan class="ink">- Ngày sinh: 05/09/1997 · </tspan><tspan class="hl">Ngoại ngữ: JLPT N3</tspan></text>
<text x="28" y="172" xml:space="preserve"><tspan class="ink">- Dự án: HANAYOYAKU (03/2024 – nay), ZAIKO-NAVI (06/2021 – 02/2024)</tspan></text>
<text x="28" y="193" xml:space="preserve"><tspan class="label">Lưu ý:</tspan></text>
<text x="28" y="214" xml:space="preserve"><tspan class="ink">- CV ghi 4 năm kinh nghiệm, nhưng dự án sớm nhất bắt đầu từ 06/2021 (tính tới nay là</tspan></text>
<text x="28" y="235" xml:space="preserve"><tspan class="ink">  5 năm 4 tháng)</tspan></text>
<text x="28" y="256" xml:space="preserve"><tspan class="ink">- ZAIKO-NAVI chưa ghi vị trí, phần việc chỉ ghi &quot;Developed backend features&quot;</tspan></text>
<text x="42" y="287" xml:space="preserve"><tspan class="fileh">Form tự vấn</tspan><tspan class="anno">   ← trong Claude Code là form chọn, ảnh ghi lại dạng danh sách</tspan></text>
<text x="42" y="308" xml:space="preserve"><tspan class="label">1. Bạn có dùng AI trong lúc phát triển không? Có thì mình thêm 2 dòng AI vào</tspan></text>
<text x="42" y="329" xml:space="preserve"><tspan class="label">   Core Skills và 1 đoạn về cách dùng AI ở cuối bio.</tspan></text>
<text x="42" y="350" xml:space="preserve"><tspan class="ink">   a. </tspan><tspan class="hl">Có, thêm đủ 2 dòng AI (Đề xuất)</tspan><tspan class="ink">  b. Chỉ ghi công cụ mình gõ  c. Không thêm</tspan></text>
<text x="42" y="371" xml:space="preserve"><tspan class="label">2. Yêu cầu cho vị trí Middle Backend: bạn đã làm việc nào? (chọn được nhiều)</tspan></text>
<text x="42" y="392" xml:space="preserve"><tspan class="ink">   a. Làm trọn feature từ yêu cầu tới deploy  b. Thiết kế DB / API cho feature</tspan></text>
<text x="42" y="413" xml:space="preserve"><tspan class="ink">   c. Chưa làm việc nào trong số này</tspan></text>
<text x="42" y="434" xml:space="preserve"><tspan class="label">3. Các dự án của bạn chủ yếu thuộc lĩnh vực nào?</tspan></text>
<text x="42" y="455" xml:space="preserve"><tspan class="ink">   a. </tspan><tspan class="hl">Đặt lịch dịch vụ làm đẹp và quản lý tồn kho bán lẻ (Đề xuất)</tspan><tspan class="ink">  b. …</tspan></text>
<text x="42" y="476" xml:space="preserve"><tspan class="label">4. CV ghi 4 năm, nhưng dự án đầu tiên bắt đầu từ 06/2021. Tổng kinh nghiệm</tspan></text>
<text x="42" y="497" xml:space="preserve"><tspan class="label">   đúng của bạn là bao nhiêu?</tspan></text>
<text x="42" y="518" xml:space="preserve"><tspan class="ink">   a. </tspan><tspan class="hl">5 năm, tính từ 06/2021 (Đề xuất)</tspan><tspan class="ink">  b. 4 năm, theo CV ghi</tspan></text>
<text x="28" y="549" xml:space="preserve"><tspan class="muted">› </tspan><tspan class="you">1: a · 2: a,b · 3: a · 4: a</tspan><tspan class="anno">   ← member chỉ cần chọn</tspan></text>
<text x="42" y="580" xml:space="preserve"><tspan class="fileh">Form mức match</tspan><tspan class="anno">   ← JD đã gửi kèm lệnh nên không hỏi lại</tspan></text>
<text x="42" y="601" xml:space="preserve"><tspan class="label">5. Bạn muốn bio bám sát JD tới mức nào?</tspan></text>
<text x="42" y="622" xml:space="preserve"><tspan class="ink">   a. </tspan><tspan class="hl">Hoàn toàn khớp (Đề xuất)</tspan><tspan class="ink">: ghi 5 năm (JD 5+), thêm AWS (3 năm), chỉ nêu</tspan></text>
<text x="42" y="643" xml:space="preserve"><tspan class="ink">      skill khớp JD; bạn đã có Laravel, MySQL, Redis/queue, PHPUnit, Docker</tspan></text>
<text x="42" y="664" xml:space="preserve"><tspan class="ink">   b. Tương đối khớp: giữ 5 năm, thêm AWS (2 năm), giữ bức tranh toàn diện</tspan></text>
<text x="42" y="685" xml:space="preserve"><tspan class="ink">   c. Tổng quát: giữ 5 năm, không thêm AWS, nêu toàn bộ điểm mạnh</tspan></text>
<text x="28" y="716" xml:space="preserve"><tspan class="muted">› </tspan><tspan class="you">a</tspan></text>
<text x="42" y="747" xml:space="preserve"><tspan class="fileh">Form dự án · HANAYOYAKU</tspan><tspan class="anno">   ← đã đủ mô tả và vai trò, chỉ hỏi stack</tspan></text>
<text x="42" y="768" xml:space="preserve"><tspan class="label">6. Tech stack trong CV là PHP 8, Laravel 10, MySQL, Redis, Docker. Dự án có dùng</tspan></text>
<text x="42" y="789" xml:space="preserve"><tspan class="label">   thêm công nghệ nào dưới đây không? (chọn được nhiều)</tspan></text>
<text x="42" y="810" xml:space="preserve"><tspan class="ink">   a. </tspan><tspan class="hl">LINE Messaging API (Đề xuất)</tspan><tspan class="ink">: mô tả có nhắc thông báo LINE  b. PHPUnit …</tspan></text>
<text x="28" y="841" xml:space="preserve"><tspan class="muted">› </tspan><tspan class="you">a</tspan></text>
<text x="42" y="872" xml:space="preserve"><tspan class="fileh">Form dự án · ZAIKO-NAVI</tspan></text>
<text x="42" y="893" xml:space="preserve"><tspan class="label">7. Ở dự án ZAIKO-NAVI, bạn đã làm những việc nào? (chọn được nhiều)</tspan></text>
<text x="42" y="914" xml:space="preserve"><tspan class="ink">   a. Xây chức năng nhập / xuất kho  b. Quét barcode  c. Báo cáo tồn kho hằng tháng</tspan></text>
<text x="42" y="935" xml:space="preserve"><tspan class="ink">   d. Xây chức năng import CSV</tspan><tspan class="anno">   ← lấy từ mô tả trong CV</tspan></text>
<text x="42" y="956" xml:space="preserve"><tspan class="label">8. Tech stack trong CV là PHP 7, Laravel 8, MySQL, Vue.js 2. Có dùng thêm …?</tspan></text>
<text x="42" y="977" xml:space="preserve"><tspan class="ink">   a. Redis  b. Docker  c. PHPUnit</tspan><tspan class="anno">   ← có trong Core Skills</tspan><tspan class="ink">  d. </tspan><tspan class="hl">Không (Đề xuất)</tspan></text>
<text x="42" y="998" xml:space="preserve"><tspan class="label">9. Ở dự án ZAIKO-NAVI, bạn giữ vị trí gì?</tspan></text>
<text x="42" y="1019" xml:space="preserve"><tspan class="ink">   a. </tspan><tspan class="hl">Backend Developer (Đề xuất)</tspan><tspan class="ink">  b. Fullstack Developer  c. Team Lead</tspan></text>
<text x="28" y="1050" xml:space="preserve"><tspan class="muted">› </tspan><tspan class="you">7: a,d · 8: d · 9: a</tspan></text>

<text x="42" y="88" xml:space="preserve"><tspan class="head"># Nguyễn Văn D</tspan></text>
<text x="42" y="109" xml:space="preserve"><tspan class="label">Vị trí: </tspan><tspan class="ink">Backend Developer</tspan><tspan class="muted">  ·  </tspan><tspan class="label">Email: </tspan><tspan class="ink">d.nguyen@example.com</tspan></text>
<text x="42" y="130" xml:space="preserve"><tspan class="label">Ngày sinh: </tspan><tspan class="ink">05/09/1997</tspan><tspan class="muted">  ·  </tspan><tspan class="label">Ngoại ngữ: </tspan><tspan class="hl">JLPT N3</tspan><tspan class="anno">   ← giữ đúng như CV</tspan></text>
<text x="42" y="151" xml:space="preserve"><tspan class="head">## Short Bio</tspan></text>
<text x="42" y="172" xml:space="preserve"><tspan class="ink">Backend Developer với 5 năm phát triển web backend bằng PHP và Laravel, phần lớn</tspan></text>
<text x="42" y="193" xml:space="preserve"><tspan class="ink">cho khách hàng Nhật Bản. Các sản phẩm đã làm gồm nền tảng đặt lịch cho salon làm</tspan></text>
<text x="42" y="214" xml:space="preserve"><tspan class="ink">đẹp và hệ thống quản lý tồn kho cho chuỗi bán lẻ 40 cửa hàng.</tspan></text>
<text x="42" y="241" xml:space="preserve"><tspan class="hl">Tự làm trọn feature từ thiết kế DB và API tới deploy</tspan><tspan class="ink">, như API đặt và hủy lịch, xếp ca</tspan></text>
<text x="42" y="262" xml:space="preserve"><tspan class="ink">nhân viên, nhập xuất kho hay import dữ liệu CSV.</tspan><tspan class="anno">   ← việc member đã xác nhận ở form</tspan></text>
<text x="42" y="283" xml:space="preserve"><tspan class="ink">Lưu dữ liệu nghiệp vụ trên MySQL và dùng Redis làm queue để gửi thông báo email,</tspan></text>
<text x="42" y="304" xml:space="preserve"><tspan class="ink">LINE bất đồng bộ. Đóng gói ứng dụng bằng Docker, triển khai trên AWS với EC2, RDS</tspan></text>
<text x="42" y="325" xml:space="preserve"><tspan class="ink">và S3.</tspan></text>
<text x="42" y="352" xml:space="preserve"><tspan class="ink">Tham gia dự án từ basic design, qua detailed design tới implementation, làm việc</tspan></text>
<text x="42" y="373" xml:space="preserve"><tspan class="ink">trong team từ 6 đến 10 người. Viết unit test bằng PHPUnit cho phần backend đảm</tspan></text>
<text x="42" y="394" xml:space="preserve"><tspan class="ink">nhận.</tspan></text>
<text x="42" y="415" xml:space="preserve"><tspan class="head">## Core Skills</tspan></text>
<text x="42" y="436" xml:space="preserve"><tspan class="label">Backend/Framework: </tspan><tspan class="hl">Laravel (5 năm)</tspan><tspan class="ink">, PHP (5 năm), Eloquent ORM</tspan><tspan class="anno">  ← 4 → 5 năm</tspan></text>
<text x="42" y="457" xml:space="preserve"><tspan class="label">Cloud: </tspan><tspan class="hl">AWS (3 năm)</tspan><tspan class="ink">, EC2, RDS, S3</tspan><tspan class="anno">   ← thêm theo JD</tspan></text>
<text x="42" y="478" xml:space="preserve"><tspan class="label">Database: </tspan><tspan class="ink">MySQL (5 năm)</tspan><tspan class="anno">   ← suy từ thời gian dự án</tspan></text>
<text x="42" y="499" xml:space="preserve"><tspan class="label">Caching &amp; Queue: </tspan><tspan class="ink">Redis</tspan><tspan class="muted">  ·  </tspan><tspan class="label">Testing: </tspan><tspan class="ink">PHPUnit</tspan></text>
<text x="42" y="520" xml:space="preserve"><tspan class="label">DevOps/CI/CD: </tspan><tspan class="ink">Docker, GitHub Actions</tspan><tspan class="muted">  ·  </tspan><tspan class="label">API Integration: </tspan><tspan class="ink">RESTful API</tspan></text>
<text x="42" y="541" xml:space="preserve"><tspan class="head">## Projects</tspan></text>
<text x="42" y="562" xml:space="preserve"><tspan class="sub">### Project 1 — HANAYOYAKU</tspan></text>
<text x="42" y="583" xml:space="preserve"><tspan class="label">Thời gian: </tspan><tspan class="ink">2 năm 7 tháng (03/2024 – nay, đang làm)</tspan><tspan class="muted">  ·  </tspan><tspan class="label">Vị trí: </tspan><tspan class="ink">Backend Developer</tspan></text>
<text x="42" y="604" xml:space="preserve"><tspan class="label">Team size: </tspan><tspan class="ink">6 người</tspan></text>
<text x="42" y="625" xml:space="preserve"><tspan class="label">Vai trò trong dự án: </tspan><tspan class="ink">Xây API đặt và hủy lịch · Xếp ca làm việc cho nhân viên ·</tspan></text>
<text x="42" y="646" xml:space="preserve"><tspan class="ink">Gửi thông báo email / LINE qua queue (Redis)</tspan></text>
<text x="42" y="667" xml:space="preserve"><tspan class="label">Tech Stack: </tspan><tspan class="ink">PHP 8, Laravel 10, MySQL, Redis, Docker</tspan><tspan class="anno">   ← giữ stack thật</tspan></text>
<text x="42" y="688" xml:space="preserve"><tspan class="sub">### Project 2 — ZAIKO-NAVI</tspan></text>
<text x="42" y="709" xml:space="preserve"><tspan class="label">Thời gian: </tspan><tspan class="ink">2 năm 8 tháng (06/2021 – 02/2024)</tspan><tspan class="muted">  ·  </tspan><tspan class="label">Vị trí: </tspan><tspan class="ink">Backend Developer</tspan><tspan class="anno">  ← form dự án</tspan></text>
<text x="42" y="730" xml:space="preserve"><tspan class="label">Team size: </tspan><tspan class="ink">10 người</tspan></text>
<text x="42" y="751" xml:space="preserve"><tspan class="label">Vai trò trong dự án: </tspan><tspan class="ink">Làm nhập / xuất kho · Import dữ liệu CSV</tspan><tspan class="anno">   ← member chọn ở form</tspan></text>
<text x="42" y="772" xml:space="preserve"><tspan class="label">Tech Stack: </tspan><tspan class="ink">PHP 7, Laravel 8, MySQL, Vue.js 2</tspan></text>
<text x="28" y="803" xml:space="preserve"><tspan class="ok">Đã lưu: </tspan><tspan class="ink">short-bio-nguyen-van-d-2026-10-27.md</tspan></text>
<text x="42" y="834" xml:space="preserve"><tspan class="warnh">⚠ File short-bio-nguyen-van-d-2026-10-27.md cần kiểm tra trước khi gửi khách:</tspan></text>
<text x="42" y="855" xml:space="preserve"><tspan class="ink">- Thêm theo JD (chưa có trong profile): AWS (3 năm) với EC2, RDS, S3 (Short Bio có</tspan></text>
<text x="42" y="876" xml:space="preserve"><tspan class="ink">  câu deploy lên AWS), GitHub Actions. Bạn nên chuẩn bị trước, vì khách thường hỏi</tspan></text>
<text x="42" y="897" xml:space="preserve"><tspan class="ink">  sâu về AWS.</tspan></text>
<text x="42" y="918" xml:space="preserve"><tspan class="ink">- Companion skill thêm vào (CV chưa ghi): Eloquent ORM.</tspan></text>
<text x="42" y="939" xml:space="preserve"><tspan class="ink">- Điều chỉnh theo JD: Vue.js và Git bị bỏ khỏi Core Skills vì JD không yêu cầu</tspan></text>
<text x="42" y="960" xml:space="preserve"><tspan class="ink">  (vẫn giữ ở Tech Stack của ZAIKO-NAVI).</tspan></text>
<text x="42" y="981" xml:space="preserve"><tspan class="ink">- Điều chỉnh theo câu trả lời của bạn: tổng kinh nghiệm 4 → 5 năm (CV ghi 4).</tspan></text>
<text x="42" y="1002" xml:space="preserve"><tspan class="ink">- Suy luận: Laravel, PHP và MySQL 5 năm. CV ghi Laravel 4 năm, còn số 5 năm tính</tspan></text>
<text x="42" y="1023" xml:space="preserve"><tspan class="ink">  theo mốc 06/2021 vì cả hai dự án đều dùng các công nghệ này.</tspan></text>
<text x="42" y="1044" xml:space="preserve"><tspan class="ink">- Chưa thể hiện (yêu cầu Senior Backend): review code cho team, dẫn dắt / mentor</tspan></text>
<text x="42" y="1065" xml:space="preserve"><tspan class="ink">  thành viên, làm requirement / estimate với khách, xử lý sự cố / hiệu năng</tspan></text>
<text x="42" y="1086" xml:space="preserve"><tspan class="ink">  production. …</tspan></text>
<text x="42" y="1107" xml:space="preserve"><tspan class="ink">Bổ sung trực tiếp vào file trước khi gửi khách hàng.</tspan></text>

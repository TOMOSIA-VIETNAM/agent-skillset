<text x="42" y="88" xml:space="preserve"><tspan class="head"># Nguyễn Văn D</tspan></text>
<text x="42" y="109" xml:space="preserve"><tspan class="label">Vị trí: </tspan><tspan class="ink">Backend Developer</tspan><tspan class="muted">  ·  </tspan><tspan class="label">Email: </tspan><tspan class="ink">d.nguyen@example.com</tspan></text>
<text x="42" y="130" xml:space="preserve"><tspan class="label">Ngày sinh: </tspan><tspan class="ink">05/09/1997</tspan><tspan class="muted">  ·  </tspan><tspan class="label">Ngoại ngữ: </tspan><tspan class="hl">JLPT N3</tspan><tspan class="anno">   ← giữ đúng như CV</tspan></text>
<text x="42" y="151" xml:space="preserve"><tspan class="head">## Short Bio</tspan></text>
<text x="42" y="172" xml:space="preserve"><tspan class="ink">Backend Developer với 5 năm phát triển web bằng PHP và Laravel, phần lớn cho khách</tspan></text>
<text x="42" y="193" xml:space="preserve"><tspan class="ink">hàng Nhật Bản. Đã làm nền tảng đặt lịch cho salon làm đẹp và hệ thống quản lý tồn</tspan></text>
<text x="42" y="214" xml:space="preserve"><tspan class="ink">kho cho chuỗi bán lẻ 40 cửa hàng, nên nắm rõ nghiệp vụ lịch hẹn, ca làm việc và</tspan></text>
<text x="42" y="235" xml:space="preserve"><tspan class="ink">nhập xuất kho.</tspan></text>
<text x="42" y="262" xml:space="preserve"><tspan class="hl">Thường nhận trọn một feature, từ phân tích yêu cầu, thiết kế database và API cho tới</tspan></text>
<text x="42" y="283" xml:space="preserve"><tspan class="hl">deploy.</tspan><tspan class="anno">   ← việc member đã xác nhận ở form</tspan></text>
<text x="42" y="304" xml:space="preserve"><tspan class="ink">Đã xây API đặt và hủy lịch, xếp ca nhân viên, nhập xuất kho và import CSV trên</tspan></text>
<text x="42" y="325" xml:space="preserve"><tspan class="ink">MySQL, đồng thời đưa thông báo email và LINE sang xử lý nền qua queue Redis. Đóng</tspan></text>
<text x="42" y="346" xml:space="preserve"><tspan class="ink">gói ứng dụng bằng Docker và triển khai lên AWS với EC2, RDS và S3.</tspan></text>
<text x="42" y="373" xml:space="preserve"><tspan class="ink">Làm việc trong team 6 đến 10 người, tham gia từ basic design, detailed design tới</tspan></text>
<text x="42" y="394" xml:space="preserve"><tspan class="ink">implementation và phối hợp với frontend ở khâu tích hợp. Viết unit test bằng</tspan></text>
<text x="42" y="415" xml:space="preserve"><tspan class="ink">PHPUnit cho phần logic nghiệp vụ.</tspan></text>
<text x="42" y="442" xml:space="preserve"><tspan class="ink">Có kinh nghiệm ứng dụng AI vào quy trình phát triển phần mềm, sử dụng Claude, Cursor và</tspan></text>
<text x="42" y="463" xml:space="preserve"><tspan class="ink">MCP để hỗ trợ phân tích yêu cầu, … code review và testing. …</tspan><tspan class="anno">   ← đoạn AI</tspan></text>
<text x="42" y="484" xml:space="preserve"><tspan class="head">## Core Skills</tspan></text>
<text x="42" y="505" xml:space="preserve"><tspan class="label">Backend/Framework: </tspan><tspan class="hl">Laravel (5 năm)</tspan><tspan class="ink">, PHP (5 năm), Eloquent ORM</tspan><tspan class="anno">  ← 4 → 5 năm</tspan></text>
<text x="42" y="526" xml:space="preserve"><tspan class="label">Cloud: </tspan><tspan class="hl">AWS (3 năm)</tspan><tspan class="ink">, EC2, RDS, S3</tspan><tspan class="anno">   ← thêm theo JD</tspan></text>
<text x="42" y="547" xml:space="preserve"><tspan class="label">Database: </tspan><tspan class="ink">MySQL (5 năm)</tspan><tspan class="muted">  ·  </tspan><tspan class="label">Caching &amp; Queue: </tspan><tspan class="ink">Redis, Laravel Queue</tspan></text>
<text x="42" y="568" xml:space="preserve"><tspan class="label">Testing: </tspan><tspan class="ink">PHPUnit</tspan><tspan class="muted">  ·  </tspan><tspan class="label">DevOps/CI/CD: </tspan><tspan class="ink">Docker, GitHub Actions</tspan><tspan class="muted">  ·  </tspan><tspan class="label">API Integration: </tspan><tspan class="ink">RESTful API</tspan></text>
<text x="42" y="589" xml:space="preserve"><tspan class="label">AI / AI-assisted Development: </tspan><tspan class="ink">Claude, Cursor, MCP, Prompt Engineering, …</tspan><tspan class="anno">  ← member chọn</tspan></text>
<text x="42" y="610" xml:space="preserve"><tspan class="label">AI-driven Software Development: </tspan><tspan class="ink">AI-assisted Requirement Analysis, Code Review, …</tspan></text>
<text x="42" y="631" xml:space="preserve"><tspan class="head">## Projects</tspan></text>
<text x="42" y="652" xml:space="preserve"><tspan class="sub">### Project 1 — Nền tảng đặt lịch cho salon làm đẹp tại Nhật Bản</tspan><tspan class="anno">  ← không dùng tên thật</tspan></text>
<text x="42" y="673" xml:space="preserve"><tspan class="label">Thời gian: </tspan><tspan class="ink">2 năm 7 tháng (03/2024 – 10/2026) (đang làm)</tspan><tspan class="muted">  ·  </tspan><tspan class="label">Team size: </tspan><tspan class="ink">6 người</tspan></text>
<text x="42" y="694" xml:space="preserve"><tspan class="label">Mô tả: </tspan><tspan class="ink">Nền tảng web đặt lịch hẹn tại các salon làm đẹp ở Nhật Bản. Khách hàng đặt</tspan></text>
<text x="42" y="715" xml:space="preserve"><tspan class="ink">lịch trực tuyến, còn salon quản lý lịch làm việc của nhân viên và menu dịch vụ.</tspan></text>
<text x="42" y="736" xml:space="preserve"><tspan class="label">Vai trò trong dự án: </tspan><tspan class="ink">Xây API đặt lịch và hủy lịch · Xếp ca làm việc cho nhân viên ·</tspan></text>
<text x="42" y="757" xml:space="preserve"><tspan class="ink">Gửi thông báo email / LINE qua queue Redis · Tham gia từ basic design tới implementation</tspan></text>
<text x="42" y="778" xml:space="preserve"><tspan class="label">Tech Stack: </tspan><tspan class="ink">PHP 8, Laravel 10, MySQL, Redis, Docker, LINE Messaging API</tspan><tspan class="anno">  ← stack thật</tspan></text>
<text x="42" y="799" xml:space="preserve"><tspan class="sub">### Project 2 — Hệ thống quản lý tồn kho cho chuỗi bán lẻ</tspan></text>
<text x="42" y="820" xml:space="preserve"><tspan class="label">Thời gian: </tspan><tspan class="ink">2 năm 8 tháng (06/2021 – 02/2024)</tspan><tspan class="muted">  ·  </tspan><tspan class="label">Vị trí: </tspan><tspan class="ink">Backend Developer</tspan><tspan class="anno">  ← form dự án</tspan></text>
<text x="42" y="841" xml:space="preserve"><tspan class="label">Mô tả: </tspan><tspan class="ink">Hệ thống quản lý tồn kho cho một chuỗi bán lẻ 40 cửa hàng. …</tspan></text>
<text x="42" y="862" xml:space="preserve"><tspan class="label">Vai trò trong dự án: </tspan><tspan class="ink">Phát triển backend cho chức năng nhập / xuất kho ·</tspan></text>
<text x="42" y="883" xml:space="preserve"><tspan class="ink">Phát triển chức năng import dữ liệu CSV</tspan><tspan class="anno">   ← member chọn ở form</tspan></text>
<text x="42" y="904" xml:space="preserve"><tspan class="label">Tech Stack: </tspan><tspan class="ink">PHP 7, Laravel 8, MySQL, Vue.js 2</tspan></text>
<text x="28" y="935" xml:space="preserve"><tspan class="ok">Đã lưu: </tspan><tspan class="ink">short-bio-nguyen-van-d-2026-10-31.md</tspan></text>
<text x="42" y="966" xml:space="preserve"><tspan class="warnh">⚠ File short-bio-nguyen-van-d-2026-10-31.md cần kiểm tra trước khi gửi khách:</tspan></text>
<text x="42" y="987" xml:space="preserve"><tspan class="ink">- Projects (tiêu đề đã thay tên thật): Project 1 = HANAYOYAKU, Project 2 = ZAIKO-NAVI</tspan></text>
<text x="42" y="1008" xml:space="preserve"><tspan class="ink">- Thêm theo JD (chưa có trong profile): AWS (3 năm), EC2, RDS, S3; GitHub Actions</tspan></text>
<text x="42" y="1029" xml:space="preserve"><tspan class="ink">  (nice to have, chỉ có ở Core Skills); Eloquent ORM; Laravel Queue. Bạn chuẩn bị</tspan></text>
<text x="42" y="1050" xml:space="preserve"><tspan class="ink">  câu trả lời nếu khách hỏi</tspan></text>
<text x="42" y="1071" xml:space="preserve"><tspan class="ink">- Điều chỉnh theo JD / mốc dự án: tổng số năm 4 → 5 năm (CV ghi 4, bạn xác nhận 5</tspan></text>
<text x="42" y="1092" xml:space="preserve"><tspan class="ink">  năm tính từ 06/2021); Laravel 4 → 5 năm</tspan></text>
<text x="42" y="1113" xml:space="preserve"><tspan class="ink">- Core Skills (suy luận): PHP 5 năm, MySQL 5 năm, tính từ thời gian hai dự án</tspan></text>
<text x="42" y="1134" xml:space="preserve"><tspan class="ink">- Chưa thể hiện (yêu cầu Senior Backend): thiết kế kiến trúc / chọn công nghệ,</tspan></text>
<text x="42" y="1155" xml:space="preserve"><tspan class="ink">  review code cho team, dẫn dắt / mentor thành viên, … Bổ sung nếu bạn đã làm</tspan></text>
<text x="42" y="1176" xml:space="preserve"><tspan class="ink">Bổ sung trực tiếp vào file trước khi gửi khách hàng.</tspan></text>
